baseURL = "https://1kyte.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "Kallen Wang"
theme = "hugo-theme-stack"
enableRobotsTXT = true

[pagination]
  pagerSize = 8

[permalinks]
  posts = "/posts/:slug/"
  page = "/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[params]
  mainSections = ["posts"]
  rssFullContent = true

  [params.footer]
    since = 2021
    customText = "构建可靠的系统，沉淀有用的技术记录。"

  [params.sidebar]
    compact = false
    subtitle = "关于后端系统、云原生交付、企业集成与 AI 应用的工程笔记。"

  [params.article]
    headingAnchor = true
    math = false
    toc = true
    readingTime = true

    [params.article.list]
      showTags = true

    [params.article.license]
      enabled = false

  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 8 } },
      { type = "categories", params = { limit = 12 } },
      { type = "tag-cloud", params = { limit = 20 } },
    ]
    page = [{ type = "toc" }]

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.imageProcessing]
    autoOrient = true

    [params.imageProcessing.content]
      enabled = true
      widths = [800, 1600]

    [params.imageProcessing.thumbnail]
      enabled = true

  [params.comments]
    enabled = false

  [params.opengraph.twitter]
    card = "summary_large_image"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = -100
  [menu.main.params]
    icon = "home"

[[menu.main]]
  identifier = "writing"
  name = "文章"
  url = "/posts/"
  weight = -90
  [menu.main.params]
    icon = "messages"

[[menu.main]]
  identifier = "projects"
  name = "项目"
  url = "/projects/"
  weight = -80
  [menu.main.params]
    icon = "infinity"

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = -70
  [menu.main.params]
    icon = "user"

[[menu.main]]
  identifier = "archives"
  name = "时间线"
  url = "/archives/"
  weight = -60
  [menu.main.params]
    icon = "archives"

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = -50
  [menu.main.params]
    icon = "search"

[[menu.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/1kyte"
  [menu.social.params]
    icon = "brand-github"
    newTab = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4

[related]
  includeNewer = true
  threshold = 60
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 200
